name: food_app
description: Food delivery app - GetX + Firebase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_fonts: ^6.2.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/home_icon.png"
  adaptive_icon_background: "#008B8B"
  adaptive_icon_foreground: "assets/icons/home_icon.png"
  remove_alpha_ios: true
